name: Gerar e publicar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar-corrida
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar chave de assinatura
        env:
          KS_B64: ${{ secrets.RADAR_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RADAR_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/radar.jks"
            echo "RADAR_KEYSTORE=$RUNNER_TEMP/radar.jks" >> "$GITHUB_ENV"
            echo "RADAR_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem RADAR_KEYSTORE_BASE64: APK assinado com chave temporaria."
          fi

      - name: Testes do calculo
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Gerar APK de producao
        run: ./gradlew --no-daemon assembleRelease

      - name: Montar pagina de instalacao
        run: |
          mkdir -p site
          cp -r docs/. site/
          cp app/build/outputs/apk/release/app-release.apk site/radar-corrida.apk
          SIZE_KB=$(( $(stat -c%s site/radar-corrida.apk) / 1024 ))
          echo "{\"versao\":\"0.3.${GITHUB_RUN_NUMBER}\",\"tamanho_kb\":${SIZE_KB},\"data\":\"$(date -u +%Y-%m-%d)\"}" > site/versao.json
          echo "APK: ${SIZE_KB} KB" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: radar-corrida-apk
          path: radar-corrida/site/radar-corrida.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: radar-corrida/site

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
